spring.application.name=user-service-api
server.port=8081

spring.devtools.restart.enabled=false
eureka.client.serviceUrl.defaultZone=http://127.0.0.1:8761/eureka

spring.servlet.context-path=/api/v1
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/developersstack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8080/realms/developersstack/protocol/openid-connect/certs}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000ms

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Keycloak Admin
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:developersstack}
keycloak.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:user-service-client}
keycloak.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:your-client-secret}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# Brevo Email (formerly Sendinblue)
brevo.api-key=${BREVO_API_KEY:your-brevo-api-key}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@developersstack.com}
brevo.sender.name=${BREVO_SENDER_NAME:DevelopersStack}
brevo.templates.otp=${BREVO_OTP_TEMPLATE_ID:1}
brevo.templates.welcome=${BREVO_WELCOME_TEMPLATE_ID:2}
brevo.templates.reset-password=${BREVO_RESET_PASSWORD_TEMPLATE_ID:3}

# Notifylk SMS
notifylk.user-id=${NOTIFYLK_USER_ID:your-user-id}
notifylk.api-key=${NOTIFYLK_API_KEY:your-api-key}
notifylk.sender-id=${NOTIFYLK_SENDER_ID:DevelopersStack}
notifylk.base-url=https://app.notify.lk/api/v1/send

# OTP Configuration
otp.expiry-minutes=5
otp.length=6
otp.max-attempts=3

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-enough}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# Application
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins[0]=http://localhost:3000
app.cors.allowed-origins[1]=http://localhost:3001

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.com.developersstack.userservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG